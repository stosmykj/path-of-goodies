[package]
name = "path-of-goodies"
version = "0.1.0"
edition = "2021"
authors = ["Path of Goodies Team"]
description = "A 2D top-down adventure game built in Rust"
license = "MIT OR Apache-2.0"

[dependencies]
bevy = { version = "0.15", default-features = false, features = [
    "bevy_winit",           # Window management
    "bevy_render",          # Rendering
    "bevy_core_pipeline",   # Rendering pipeline
    "bevy_sprite",          # 2D sprite rendering
    "bevy_text",            # Text rendering
    "bevy_ui",              # UI system
    "multi_threaded",       # Multi-threading support
    "png",                  # PNG image support
    "x11",                  # Linux X11 support (disabled on WASM)
    "webgl2",               # WebGL2 rendering (web)
] }
rand = "0.8"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = "0.3"

[profile.dev]
opt-level = 1  # Faster compile times with minimal optimization

[profile.dev.package."*"]
opt-level = 3  # Optimize dependencies even in dev mode

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1

# Optimize for WASM size
[profile.wasm-release]
inherits = "release"
opt-level = "z"     # Optimize for size
lto = "fat"
codegen-units = 1
strip = true

# Fast compile settings for development
[profile.dev-fast]
inherits = "dev"
opt-level = 0
