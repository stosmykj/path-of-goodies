<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Path of Goodies</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0f;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            color: #ffffff;
        }

        #game-container {
            text-align: center;
            max-width: 100%;
        }

        h1 {
            font-size: 2.5rem;
            margin-bottom: 1rem;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        #bevy {
            border: 2px solid #667eea;
            border-radius: 8px;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.3);
            max-width: 100%;
            height: auto;
        }

        .info {
            margin-top: 1rem;
            font-size: 0.9rem;
            color: #a0a0a0;
        }

        .controls {
            margin-top: 1.5rem;
            padding: 1rem;
            background-color: rgba(102, 126, 234, 0.1);
            border-radius: 8px;
            border: 1px solid rgba(102, 126, 234, 0.3);
        }

        .controls h2 {
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
            color: #667eea;
        }

        .controls p {
            margin: 0.5rem 0;
            font-size: 0.95rem;
        }

        .loading {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 1rem;
        }

        .spinner {
            width: 50px;
            height: 50px;
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top-color: #667eea;
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 1.8rem;
            }

            #bevy {
                width: 100vw;
                height: 100vh;
                border: none;
                border-radius: 0;
            }
        }
    </style>
</head>
<body>
    <div id="game-container">
        <h1>Path of Goodies</h1>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading game...</p>
        </div>

        <canvas id="bevy"></canvas>

        <div class="controls">
            <h2>Controls</h2>
            <p><strong>WASD</strong> or <strong>Arrow Keys</strong> - Move</p>
            <p>More controls coming soon!</p>
        </div>

        <div class="info">
            <p>Built with Rust and Bevy | WebAssembly</p>
        </div>
    </div>

    <script type="module">
        // Hide loading spinner once game loads
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loading').style.display = 'none';
            }, 1000);
        });
    </script>
</body>
</html>
