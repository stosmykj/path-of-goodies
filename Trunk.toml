[[hooks]]
stage = "pre_build"
command = "sh"
command_arguments = ["-c", "echo 'Building WASM...'"]

[[hooks]]
stage = "build"
command = "cargo"
command_arguments = ["build", "--release", "--target", "wasm32-unknown-unknown"]

[build]
target = "index.html"
dist = "dist"

[watch]
ignore = ["dist", "target"]

[serve]
address = "127.0.0.1"
port = 8080
open = false
